<!DOCTYPE html>
<html ng-app="studentApp">

<head>
    <title>AngularJS XML and HTTP</title>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>

<body ng-controller="StudentController">

    <h2>Student Records</h2>

    <button ng-click="getStudents()">
        GET Student Data
    </button>

    <h3>Student List</h3>

    <ul>
        <li ng-repeat="student in students">
            Roll No: {{ student.rollNo }},
            Name: {{ student.name }},
            Course: {{ student.course }},
            Marks: {{ student.marks }}
        </li>
    </ul>

    <hr>

    <h2>Add Student</h2>

    <form ng-submit="addStudent()">

        Roll No:
        <input type="number" ng-model="newStudent.rollNo" required>
        <br><br>

        Name:
        <input type="text" ng-model="newStudent.name" required>
        <br><br>

        Course:
        <input type="text" ng-model="newStudent.course" required>
        <br><br>

        Marks:
        <input type="number" ng-model="newStudent.marks" required>
        <br><br>

        <button type="submit">
            POST Student Data
        </button>

    </form>

    <p>{{ message }}</p>


    <script>

        var app = angular.module("studentApp", []);

        app.controller("StudentController", function($scope, $http) {

            $scope.students = [];

            // GET Method
            $scope.getStudents = function() {

                $http.get("students.xml")
                .then(function(response) {

                    var xmlData = response.data;

                    var xmlParser = new DOMParser();

                    var xmlDoc = xmlParser.parseFromString(
                        xmlData,
                        "text/xml"
                    );

                    var studentNodes =
                        xmlDoc.getElementsByTagName("student");

                    $scope.students = [];

                    for (var i = 0; i < studentNodes.length; i++) {

                        $scope.students.push({

                            rollNo: studentNodes[i]
                                .getElementsByTagName("rollNo")[0]
                                .textContent,

                            name: studentNodes[i]
                                .getElementsByTagName("name")[0]
                                .textContent,

                            course: studentNodes[i]
                                .getElementsByTagName("course")[0]
                                .textContent,

                            marks: studentNodes[i]
                                .getElementsByTagName("marks")[0]
                                .textContent
                        });
                    }

                    $scope.message =
                        "XML data retrieved successfully.";

                }, function(error) {

                    $scope.message =
                        "Error retrieving XML data.";

                });

            };


            // Object for POST
            $scope.newStudent = {};


            // POST Method
            $scope.addStudent = function() {

                $http.post(
                    "http://localhost:5000/students",
                    $scope.newStudent
                )
                .then(function(response) {

                    $scope.message =
                        "Student data sent successfully.";

                    console.log(response.data);

                }, function(error) {

                    $scope.message =
                        "Error sending student data.";

                });

            };

        });

    </script>
    <style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background-color: #f4f7fb;
        margin: 0;
        padding: 30px;
        color: #333;
    }

    .container {
        max-width: 850px;
        margin: auto;
        background-color: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    h1 {
        text-align: center;
        color: #1e3a8a;
        margin-bottom: 10px;
    }

    h2 {
        color: #2563eb;
        border-bottom: 2px solid #2563eb;
        padding-bottom: 8px;
    }

    h3 {
        color: #374151;
    }

    button {
        background-color: #2563eb;
        color: white;
        border: none;
        padding: 11px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 15px;
        margin: 8px 0;
    }

    button:hover {
        background-color: #1d4ed8;
    }

    form {
        background-color: #f8fafc;
        padding: 20px;
        border-radius: 8px;
        border: 1px solid #e2e8f0;
    }

    label {
        display: block;
        font-weight: bold;
        margin-top: 12px;
        margin-bottom: 5px;
    }

    input {
        width: 100%;
        padding: 10px;
        border: 1px solid #cbd5e1;
        border-radius: 5px;
        font-size: 14px;
    }

    input:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 4px rgba(37, 99, 235, 0.3);
    }

    ul {
        padding: 0;
        list-style: none;
    }

    li {
        background-color: #eff6ff;
        margin: 10px 0;
        padding: 12px;
        border-left: 4px solid #2563eb;
        border-radius: 5px;
    }

    .message {
        margin-top: 15px;
        padding: 12px;
        background-color: #dcfce7;
        color: #166534;
        border-radius: 5px;
        font-weight: bold;
    }

    hr {
        margin: 30px 0;
        border: none;
        border-top: 1px solid #ddd;
    }
</style>

</body>
</html>
